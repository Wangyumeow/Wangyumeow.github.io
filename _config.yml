# ============================================
# _config.yml — Wang Yu'ao Academic Website
# Modern Academic Minimalism · Jekyll + GitHub Pages
# ============================================

# Basic Site Settings
locale                   : "zh-CN"
title                    : "王宇傲 - Wang Yu'ao"
title_separator          : "-"
name                     : "王宇傲"
description              : "王宇傲的学术主页 — 复旦大学国际政治与国际传播专业硕士研究生"
url                      : https://Wangyumeow.github.io
baseurl                  : ""
repository               : "Wangyumeow/Wangyumeow.github.io"

# Site Author
author:
  avatar                 : "profile-placeholder.svg"
  name                   : "王宇傲 Wang Yu'ao"
  pronouns               : "he/him"
  bio                    : "International Relations Researcher"
  location               : "Shanghai"
  employer               : "Fudan University"
  email                  : "Jasonwong_011003@163.com"
  github                 : "Wangyumeow"
  orcid                  :
  googlescholar          :

# Publication Categories
publication_category:
  books:
    title: '<span class="lang-zh">书籍与报刊</span><span class="lang-en">Books &amp; Press</span><span class="lang-ja">書籍・新聞</span>'
  manuscripts:
    title: '<span class="lang-zh">学术论文</span><span class="lang-en">Journal Articles</span><span class="lang-ja">学術論文</span>'
  conferences:
    title: '<span class="lang-zh">会议论文</span><span class="lang-en">Conference Papers</span><span class="lang-ja">学会発表論文</span>'

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true

# SEO Related
google_site_verification :
bing_site_verification   :

# Analytics
analytics:
  provider               : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - LICENSE
  - node_modules
  - package.json
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false
      share: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      share: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-feed
  - jekyll-sitemap

whitelist:
  - jekyll-feed
  - jekyll-sitemap

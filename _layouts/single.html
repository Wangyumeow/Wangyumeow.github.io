---
layout: default
---

{% include base_path %}

<div id="main" role="main">
  <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap">
      {% unless page.header.overlay_color or page.header.overlay_image %}
        <header class="page__header" data-reveal>
          {% if page.title %}<h1 class="page__title" itemprop="headline">{{ page.title }}</h1>{% endif %}
        </header>
      {% endunless %}

      <section class="page__content" itemprop="text" data-reveal>
        {{ content }}
      </section>
    </div>
  </article>
</div>

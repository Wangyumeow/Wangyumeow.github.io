about_bio: |
  王宇傲，复旦大学国际政治—国际传播专业硕士研究生（2025–2028），由国际关系与公共事务学院（学籍单位）与国际传播与全球领导力学院（培养单位）联合培养，推荐免试入学。

  主要研究兴趣聚焦于日本问题与国际治理议题两个方向：日本问题研究（日本的国际传播、日本国内与国际政治）；国际治理议题研究（环境与国际政治、国际传播话语与国家形象）。

  本科毕业于复旦大学国际政治专业（辅修新闻学），曾获复旦大学优秀学生、优秀毕业生等荣誉。

about_education_items:
  - period: "2025.09 – 2028.06"
    degree: "国际政治—国际传播，硕士（学术学位）"
    institution: "复旦大学"
    detail: "国际关系与公共事务学院与国际传播与全球领导力学院联合培养，推荐免试入学。"
  - period: "2021.09 – 2025.06"
    degree: "国际政治（辅修新闻学），本科（法学学士）"
    institution: "复旦大学"
    detail: "优秀学生二等奖学金×1、三等奖学金×2；复旦大学优秀学生、优秀毕业生。"


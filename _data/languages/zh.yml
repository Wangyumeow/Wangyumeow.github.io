about_interdisciplinary: |
  兼具国际政治与新闻学跨学科知识体系。实践经验涵盖媒体运营（复旦大学党委宣传部融媒体中心）、行政党务（复旦大学国务学院）及国际事务（香港贸易发展局进博会项目）等领域。


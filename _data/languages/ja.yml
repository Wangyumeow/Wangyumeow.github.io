about_bio: |
  王宇傲（ワン・ユーアオ）は、復旦大学国際政治・国際コミュニケーション専攻の修士課程大学院生（2025–2028）です。国際関係・公共事務学院と国際コミュニケーション・グローバルリーダーシップ学院の共同養成プログラムに推薦免試で入学しました。

  主な研究関心は日本研究とグローバル・ガバナンスの2つの分野です。日本の国際コミュニケーション、日本の国内・国際政治、環境と国際政治、国際コミュニケーションの言説と国家イメージなどを研究テーマとしています。

  復旦大学国際政治専攻（新聞学副専攻）を卒業。復旦大学優秀学生、優秀卒業生の栄誉を受賞しています。


about_bio: |
  Wang Yu'ao is a Master's student in International Politics and International Communication at Fudan University (2025–2028), jointly trained by the School of International Relations and Public Affairs (SIRPA) and the School of International Communication and Global Leadership (SICGL), admitted through the recommendation exemption program.

  His research focuses on Japan studies and global governance. Specifically, he examines Japan's international communication, domestic and international politics, as well as environmental politics, international communication discourse, and national image construction.

  He holds a B.A. in International Politics (Minor in Journalism) from Fudan University, where he received the Outstanding Student and Outstanding Graduate awards.


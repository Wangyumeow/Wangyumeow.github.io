{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts: Noto Serif SC (思源宋体) for Chinese academic typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Language Switcher Styles -->
<style>
  /* --- Language switcher buttons --- */
  .lang-switcher {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: 16px;
    flex-shrink: 0;
  }
  .lang-btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.5;
    border: 1px solid #bbb;
    border-radius: 20px;
    background: transparent;
    color: #555;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    font-family: inherit;
  }
  .lang-btn:hover {
    border-color: #666;
    color: #222;
    background: rgba(0,0,0,0.04);
  }
  .lang-btn.active {
    background: #494e52;
    color: #fff;
    border-color: #494e52;
  }

  /* --- Language visibility rules --- */
  /* Default: show all (no-JS fallback) */
  [data-lang="zh"] .lang-en,
  [data-lang="zh"] .lang-ja { display: none !important; }
  [data-lang="en"] .lang-zh,
  [data-lang="en"] .lang-ja { display: none !important; }
  [data-lang="ja"] .lang-zh,
  [data-lang="ja"] .lang-en { display: none !important; }

  /* Masthead menu flex layout for lang switcher */
  .masthead__menu {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Responsive: hide lang switcher on narrow screens */
  @media (max-width: 600px) {
    .lang-switcher {
      display: none;
    }
  }
</style>

<script>
  // Set language attribute immediately to prevent flash-of-all-languages
  (function() {
    var lang = (new URLSearchParams(window.location.search)).get('lang');
    if (!lang) {
      lang = localStorage.getItem('lang');
    }
    if (!lang && navigator.language) {
      var bl = navigator.language.toLowerCase();
      if (bl.startsWith('zh')) lang = 'zh';
      else if (bl.startsWith('ja')) lang = 'ja';
      else lang = 'en';
    }
    if (lang && ['zh','en','ja'].indexOf(lang) >= 0) {
      document.documentElement.setAttribute('data-lang', lang);
    }
  })();
</script>

<!-- end custom head snippets -->

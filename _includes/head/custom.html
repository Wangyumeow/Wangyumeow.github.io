<!-- Masthead menu flex layout for lang switcher -->
<style>
  .masthead__menu {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  @media (max-width: 600px) {
    .lang-switcher { display: none; }
  }
</style>

<!-- Language detection + visibility control -->
<!-- CSS rules in _language_switcher.scss (compiled into main.css) use html[data-lang] to hide non-matching languages -->
<!-- JS below sets data-lang attribute + applies inline styles as belt-and-suspenders backup -->
<script>
  (function() {
    function detectLang() {
      var lang = (new URLSearchParams(window.location.search)).get('lang');
      if (!lang) lang = localStorage.getItem('lang');
      if (!lang && navigator.language) {
        var bl = navigator.language.toLowerCase();
        if (bl.startsWith('zh')) lang = 'zh';
        else if (bl.startsWith('ja')) lang = 'ja';
        else lang = 'en';
      }
      if (!lang || ['zh','en','ja'].indexOf(lang) < 0) lang = 'en';
      return lang;
    }

    var lang = detectLang();

    // Set data-lang on <html> — this activates CSS rules in main.css
    document.documentElement.setAttribute('data-lang', lang);

    // Backup: also set inline styles (highest CSS priority)
    window.setLangVisibility = function(l) {
      var tags = ['zh','en','ja'];
      for (var t = 0; t < tags.length; t++) {
        var tag = tags[t];
        var els = document.querySelectorAll('.lang-' + tag);
        for (var i = 0; i < els.length; i++) {
          if (tag === l) {
            els[i].style.removeProperty('display');
          } else {
            els[i].style.setProperty('display', 'none', 'important');
          }
        }
      }
    };

    // Apply on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
      var currentLang = document.documentElement.getAttribute('data-lang');
      window.setLangVisibility(currentLang);

      // MutationObserver: re-apply if greedy-nav or other JS modifies the DOM
      var observer = new MutationObserver(function(mutations) {
        window.setLangVisibility(document.documentElement.getAttribute('data-lang'));
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });

    // Final fallback: re-apply after everything (including main.min.js) loads
    window.addEventListener('load', function() {
      window.setLangVisibility(document.documentElement.getAttribute('data-lang'));
    });

    window._currentLang = lang;
  })();
</script>

<!-- end custom head snippets -->

<!-- Language switcher core JS -->
<script>
  (function() {
    // Determine initial language
    var storedLang = null;
    try { storedLang = localStorage.getItem('lang'); } catch(e) {}

    var initLang = storedLang;
    if (!initLang || ['zh','en','ja'].indexOf(initLang) < 0) {
      var bl = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (bl.indexOf('zh') === 0) initLang = 'zh';
      else if (bl.indexOf('ja') === 0) initLang = 'ja';
      else initLang = 'en';
    }

    // Set html data-lang immediately (before DOM renders) to prevent flash
    document.documentElement.setAttribute('data-lang', initLang);

    window.switchLang = function(lang) {
      if (['zh','en','ja'].indexOf(lang) < 0) lang = 'en';
      document.documentElement.setAttribute('data-lang', lang);
      try { localStorage.setItem('lang', lang); } catch(e) {}

      // Toggle visibility of all .lang-XX elements
      var tags = ['zh','en','ja'];
      for (var t = 0; t < tags.length; t++) {
        var tag = tags[t];
        var els = document.getElementsByClassName('lang-' + tag);
        for (var i = els.length - 1; i >= 0; i--) {
          if (tag === lang) {
            els[i].style.removeProperty('display');
          } else {
            els[i].style.setProperty('display', 'none', 'important');
          }
        }
      }

      // Update active button state
      var btns = document.querySelectorAll('.lang-btn');
      for (var j = 0; j < btns.length; j++) {
        if (btns[j].getAttribute('data-lang') === lang) {
          btns[j].classList.add('active');
        } else {
          btns[j].classList.remove('active');
        }
      }

      // Update html lang attribute
      var langMap = { zh: 'zh-CN', en: 'en', ja: 'ja' };
      document.documentElement.setAttribute('lang', langMap[lang] || 'en');
    };

    // Apply language at multiple stages to handle greedy-nav DOM rewrites
    function applyLang() {
      window.switchLang(document.documentElement.getAttribute('data-lang') || initLang);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyLang);
    } else {
      applyLang();
    }

    window.addEventListener('load', function() {
      setTimeout(applyLang, 50);
      setTimeout(applyLang, 200);
    });

    // MutationObserver: re-apply when greedy-nav rewrites the DOM
    var observerStarted = false;
    function startObserver() {
      if (observerStarted || !window.MutationObserver) return;
      observerStarted = true;
      var obs = new MutationObserver(function() {
        window.switchLang(document.documentElement.getAttribute('data-lang') || initLang);
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
    window.addEventListener('load', startObserver);
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(startObserver, 100);
    });
  })();
</script>

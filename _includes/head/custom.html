<!-- Masthead menu flex layout for lang switcher -->
<style>
  .masthead__menu {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  @media (max-width: 600px) {
    .lang-switcher { display: none; }
  }
</style>

<!-- Language switcher: sets each .lang-XX element's display directly, no CSS dependency -->
<script>
  window.switchLang = function(lang) {
    // Only allow zh/en/ja
    if (['zh','en','ja'].indexOf(lang) < 0) lang = 'zh';

    // Update html attribute (may trigger CSS, but we don't rely on it)
    document.documentElement.setAttribute('data-lang', lang);
    localStorage.setItem('lang', lang);

    // Walk every .lang-zh, .lang-en, .lang-ja element and set display directly
    var tags = ['zh','en','ja'];
    for (var t = 0; t < tags.length; t++) {
      var tag = tags[t];
      var els = document.getElementsByClassName('lang-' + tag);
      // getElementsByClassName returns a live HTMLCollection — convert to array
      for (var i = els.length - 1; i >= 0; i--) {
        if (tag === lang) {
          els[i].style.removeProperty('display');
        } else {
          els[i].style.setProperty('display', 'none', 'important');
        }
      }
    }

    // Update button active state
    var btns = document.querySelectorAll('.lang-btn');
    for (var j = 0; j < btns.length; j++) {
      if (btns[j].getAttribute('data-lang') === lang) {
        btns[j].classList.add('active');
      } else {
        btns[j].classList.remove('active');
      }
    }
  };

  // Determine language from localStorage or browser
  (function() {
    var lang = localStorage.getItem('lang');
    if (!lang) {
      var bl = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (bl.indexOf('zh') === 0) lang = 'zh';
      else if (bl.indexOf('ja') === 0) lang = 'ja';
      else lang = 'en';
    }

    // Apply language visibility
    function applyNow() {
      window.switchLang(lang);
    }

    // Phase 1: run as soon as DOM is interactive
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyNow);
    } else {
      applyNow();
    }

    // Phase 2: re-run after ALL resources (main.min.js, greedy-nav) finish loading
    window.addEventListener('load', function() {
      // Small delay to let greedy-nav finish DOM manipulation
      setTimeout(applyNow, 50);
      setTimeout(applyNow, 200);
    });

    // Phase 3: MutationObserver watches for greedy-nav DOM rewrites
    var observerStarted = false;
    function startObserver() {
      if (observerStarted || !window.MutationObserver) return;
      observerStarted = true;
      var obs = new MutationObserver(function() {
        window.switchLang(document.documentElement.getAttribute('data-lang') || lang);
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
    window.addEventListener('load', startObserver);
    // Also start observer earlier as a fallback
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(startObserver, 100);
    });
  })();
</script>

<!-- end custom head snippets -->

<!-- Language Switcher — inline critical CSS + JS (prevents FOUC)          -->
<!-- ===================================================================== -->
<style>
  /* --- Visibility by language (critical, loaded before render) --- */
  html[data-lang="zh"] .lang-en,
  html[data-lang="zh"] .lang-ja { display: none !important; }
  html[data-lang="en"] .lang-zh,
  html[data-lang="en"] .lang-ja { display: none !important; }
  html[data-lang="ja"] .lang-zh,
  html[data-lang="ja"] .lang-en { display: none !important; }

  /* --- Language switcher buttons --- */
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 0.5em;
  }
  .lang-switcher .lang-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 28px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: #666;
    text-decoration: none;
    border: 1px solid #ccc;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .lang-switcher .lang-btn:hover {
    color: #333;
    background: #f0f0f0;
    border-color: #999;
  }
  .lang-switcher .lang-btn.active {
    color: #fff;
    background: #2c3e50;
    border-color: #2c3e50;
  }
  /* Dark theme overrides */
  [data-theme="dark"] .lang-switcher .lang-btn {
    color: #bbb;
    border-color: #555;
    background: #222;
  }
  [data-theme="dark"] .lang-switcher .lang-btn:hover {
    color: #fff;
    background: #333;
    border-color: #777;
  }
  [data-theme="dark"] .lang-switcher .lang-btn.active {
    color: #fff;
    background: #4a7fb5;
    border-color: #4a7fb5;
  }
  /* Responsive */
  @media (max-width: 600px) {
    .lang-switcher .lang-btn {
      min-width: 26px;
      height: 24px;
      padding: 0 6px;
      font-size: 11px;
      border-radius: 12px;
    }
  }
</style>

<script>
  /* Immediate language detection — runs before any CSS paint */
  (function() {
    var SUPPORTED = ['zh','en','ja'];
    var DEFAULT = 'zh';
    var STORAGE_KEY = 'site-lang';

    function detect() {
      var params = new URLSearchParams(window.location.search);
      var urlLang = params.get('lang');
      if (urlLang && SUPPORTED.indexOf(urlLang) !== -1) {
        try { localStorage.setItem(STORAGE_KEY, urlLang); } catch(e) {}
        return urlLang;
      }
      try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
      } catch(e) {}
      var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (nav.indexOf('zh') === 0) return 'zh';
      if (nav.indexOf('ja') === 0) return 'ja';
      return 'en';
    }

    document.documentElement.setAttribute('data-lang', detect());
  })();
</script>

<!-- Full language switcher logic (loaded after DOM) -->
<script src="{{ base_path }}/assets/js/lang-switcher.js"></script>

<!-- end custom head snippets -->
